<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>
        <div class = "container">
 
          <div class = "display"></div>
          <div class = "clear">AC</div>
        <div class = "digits-operator"> 
          <div class = "digit seven">7</div>
          <div class = "digit eight">8</div>
          <div class = "digit nine">9</div>
          <div class = "digit division">÷</div>
          <div class = "digit four">4</div>
          <div class = "digit five">5</div>
          <div class = "digit six">6</div>
          <div class = "digit multiplication">×</div>
          <div class = "digit one">1</div>
          <div class = "digit two">2</div>
          <div class = "digit three">3</div>
          <div class = "digit substraction">-</div>
          <div class = "digit zero">0</div>
          <div class = "digit dot">.</div>
          <div class = "digit equal">=</div>
          <div class = "digit addition">+</div>

        </div> 


        </div>
    
</body>
</html>
