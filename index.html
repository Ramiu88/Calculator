<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>
        <div class = "container">
 
          <div class = "display"></div>
          <div class = "clear"><div>AC</div></div>
        <div class = "digits-operator"> 
          <div class = "digit seven"><div>7</div></div>
          <div class = "digit eight"><div>8</div></div>
          <div class = "digit nine"><div>9</div></div>
          <div class = "digit division"><div>÷</div></div>
          <div class = "digit four"><div>4</div></div>
          <div class = "digit five"><div>5</div></div>
          <div class = "digit six"><div>6</div></div>
          <div class = "digit multiplication"><div>×</div></div>
          <div class = "digit one"><div>1</div></div>
          <div class = "digit two"><div>2</div></div>
          <div class = "digit three"><div>3</div></div>
          <div class = "digit substraction"><div>-</div></div>
          <div class = "digit zero"><div>0</div></div>
          <div class = "digit dot"><div>.</div></div>
          <div class = "digit equal"><div>=</div></div>
          <div class = "digit addition"><div>+</div></div>

        </div> 


        </div>
    
</body>
</html>
